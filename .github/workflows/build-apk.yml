name: Build Debug & Release APKs and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js and npm environment
        run: |
          set -euo pipefail
          node -v
          npm -v
          NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "ERROR: Capacitor CLI 8.5+ and Vite 8.3+ require Node.js >= 22.0.0 (detected Node v$(node -v))."
            exit 1
          fi

      - name: Install dependencies, build Web application, and sync Capacitor Android
        env:
          VITE_API_BASE_URL: https://ais-pre-dkfhfrzboel3a3xnlpek5a-752786783113.asia-northeast1.run.app
          VITE_WS_URL: wss://ais-pre-dkfhfrzboel3a3xnlpek5a-752786783113.asia-northeast1.run.app/ws
        run: |
          set -euo pipefail
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          npm run build
          npx cap sync android
          node scripts/prepare-android-apk.mjs

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: java command not found."
            exit 1
          fi
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          JAVA_MAJOR="$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "([0-9]+).*/\1/')"
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version from: $JAVA_VER_LINE"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "ERROR: Temporary ./debug.keystore could not be created."
            exit 1
          fi
          cp ./debug.keystore ./android/debug.keystore || true
          cp ./debug.keystore ./android/app/debug.keystore || true
          echo "Temporary ./debug.keystore is ready."

      - name: Build Debug and Release APKs
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Debug and Release APKs
        id: verify_apks
        run: |
          set -euo pipefail
          DEBUG_APK_PRIMARY="android/app/build/outputs/apk/debug/app-debug.apk"
          DEBUG_APK_ROOT="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK_PRIMARY="android/app/build/outputs/apk/release/app-release.apk"
          RELEASE_APK_ROOT="app/build/outputs/apk/release/app-release.apk"

          if [ -f "$DEBUG_APK_PRIMARY" ] && [ ! -f "$DEBUG_APK_ROOT" ]; then
            mkdir -p "$(dirname "$DEBUG_APK_ROOT")"
            cp "$DEBUG_APK_PRIMARY" "$DEBUG_APK_ROOT"
          fi
          if [ -f "$RELEASE_APK_PRIMARY" ] && [ ! -f "$RELEASE_APK_ROOT" ]; then
            mkdir -p "$(dirname "$RELEASE_APK_ROOT")"
            cp "$RELEASE_APK_PRIMARY" "$RELEASE_APK_ROOT"
          fi

          for APK_FILE in "$DEBUG_APK_PRIMARY" "$DEBUG_APK_ROOT" "$RELEASE_APK_PRIMARY" "$RELEASE_APK_ROOT"; do
            if [ ! -f "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
              echo "ERROR: Expected APK missing or empty at $APK_FILE"
              find android/app/build/outputs/apk app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
              exit 1
            fi
            FILE_SIZE="$(wc -c < "$APK_FILE")"
            echo "Verified $APK_FILE (${FILE_SIZE} bytes)"
          done
          echo "apk_verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          DEBUG_ASSET_PATH="${TEMP_RELEASE_DIR}/app-debug.apk"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/app-release.apk"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_ASSET_PATH"
          cp "app/build/outputs/apk/release/app-release.apk" "$RELEASE_ASSET_PATH"

          if [ ! -f "$DEBUG_ASSET_PATH" ] || [ ! -s "$DEBUG_ASSET_PATH" ]; then
            echo "ERROR: Prepared debug release asset is missing or empty at $DEBUG_ASSET_PATH"
            exit 1
          fi
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty at $RELEASE_ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${DEBUG_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "release_asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          DEBUG_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.release_asset_path }}"

          if [ ! -f "$DEBUG_ASSET" ] || [ ! -s "$DEBUG_ASSET" ]; then
            echo "ERROR: Prepared debug APK asset missing or empty."
            exit 1
          fi
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared release APK asset missing or empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")"

          cat <<EOF > "$NOTES_FILE"
          - Automatically generated Beacon Network Android APK build (Debug + Release).
          - Built by GitHub Actions (Node 22 + Vite + Capacitor 8 + Java 17 + AGP 9.1.1 + Gradle 9.3.1).
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Production Backend: https://ais-pre-dkfhfrzboel3a3xnlpek5a-752786783113.asia-northeast1.run.app
          - Assets attached: app-debug.apk and app-release.apk
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DEBUG_ASSET#app-debug.apk" "$RELEASE_ASSET#app-release.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$DEBUG_ASSET#app-debug.apk" "$RELEASE_ASSET#app-release.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              --latest
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          APK_VERIFIED="${{ steps.verify_apks.outputs.apk_verified }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
            DIRECT_DEBUG_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            DIRECT_RELEASE_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.apk"

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filenames: app-debug.apk, app-release.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_DEBUG_APK_URL}"
            echo "DIRECT RELEASE APK DOWNLOAD: ${DIRECT_RELEASE_APK_URL}"
            echo "Backup GitHub Actions artifacts 'app-debug-apk' and 'app-release-apk' remain available."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo "- **Debug APK:** ${DIRECT_DEBUG_APK_URL}"
              echo "- **Release APK:** ${DIRECT_RELEASE_APK_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **Backup Artifacts:** \`app-debug-apk\` and \`app-release-apk\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ "$APK_VERIFIED" = "true" ]; then
              echo "The APK builds succeeded and the GitHub Actions artifacts 'app-debug-apk' and 'app-release-apk' remain available."
            else
              echo "The APK build did not complete; check earlier build steps."
            fi
          fi
