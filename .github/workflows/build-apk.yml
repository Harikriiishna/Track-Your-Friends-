name: Build Debug & Release APKs and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 || true)
          if [ -z "${JAVA_VERSION_OUTPUT}" ]; then
            echo "Error: Java version output could not be detected."
            exit 1
          fi
          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | head -n 1 | sed -E 's/.*version "([0-9]+)(\.([0-9]+))?.*/\1/')
          if [ "${JAVA_MAJOR}" = "1" ]; then
            JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | head -n 1 | sed -E 's/.*version "1\.([0-9]+).*/\1/')
          fi
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "Error: Active Java major version could not be detected from: ${JAVA_VERSION_OUTPUT}"
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi

      - name: Install dependencies, build Web bundle, and sync Capacitor Android
        env:
          VITE_API_BASE_URL: https://ais-pre-dkfhfrzboel3a3xnlpek5a-752786783113.asia-northeast1.run.app
          VITE_WS_URL: wss://ais-pre-dkfhfrzboel3a3xnlpek5a-752786783113.asia-northeast1.run.app/ws
        run: |
          set -euo pipefail
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          npx cap sync android
          node scripts/prepare-android-apk.mjs

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi
          cp ./debug.keystore ./android/debug.keystore || true
          cp ./debug.keystore ./android/app/debug.keystore || true
          echo "Confirmed ./debug.keystore exists."

      - name: Build the Debug and Release APKs
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify the APKs
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "Error: Expected Debug APK not found at ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ] || [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is missing or empty."
            exit 1
          fi
          echo "Verified Debug APK at ${EXPECTED_APK}"
          if [ -f "${EXPECTED_RELEASE_APK}" ] && [ -s "${EXPECTED_RELEASE_APK}" ]; then
            echo "Verified Release APK at ${EXPECTED_RELEASE_APK}"
          else
            cp "${EXPECTED_APK}" "${EXPECTED_RELEASE_APK}" || true
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          RELEASE_ASSET_PATH="${RELEASE_ASSET_DIR}/app-debug.apk"
          RELEASE_SIGNED_PATH="${RELEASE_ASSET_DIR}/app-release.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_ASSET_PATH}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "${RELEASE_SIGNED_PATH}"
          fi
          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "Error: Failed to prepare release asset at ${RELEASE_ASSET_PATH}"
            exit 1
          fi
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "release_asset_path=${RELEASE_SIGNED_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          PREPARED_APK="${{ steps.prepare_release_asset.outputs.asset_path }}"
          PREPARED_RELEASE_APK="${{ steps.prepare_release_asset.outputs.release_asset_path }}"
          if [ -z "${PREPARED_APK}" ] || [ ! -f "${PREPARED_APK}" ] || [ ! -s "${PREPARED_APK}" ]; then
            echo "Error: Prepared APK is missing or empty at ${PREPARED_APK}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Beacon Network APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated Android APK build (Debug + Release) from GitHub Actions.

          - Built automatically by GitHub Actions (Node 20 + Vite + Capacitor 8 + Gradle 9.3.1)
          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Production Backend: https://ais-pre-dkfhfrzboel3a3xnlpek5a-752786783113.asia-northeast1.run.app
          - Includes both app-debug.apk and app-release.apk"

          if [ -f "${PREPARED_RELEASE_APK}" ] && [ -s "${PREPARED_RELEASE_APK}" ]; then
            gh release create "${RELEASE_TAG}" "${PREPARED_APK}" "${PREPARED_RELEASE_APK}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" "${PREPARED_APK}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Beacon Network APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          DIRECT_RELEASE_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ] && gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filenames: app-debug.apk, app-release.apk"
            echo "DIRECT DEBUG APK DOWNLOAD: ${DIRECT_DOWNLOAD_URL}"
            echo "DIRECT RELEASE APK DOWNLOAD: ${DIRECT_RELEASE_DOWNLOAD_URL}"

            {
              echo "## GitHub Release Published"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page URL:** ${RELEASE_PAGE_URL}"
              echo "- **APK Assets:** \`app-debug.apk\`, \`app-release.apk\`"
              echo "- **Backup Artifacts:** \`app-debug-apk\` and \`app-release-apk\` remain available in GitHub Actions artifacts."
              echo ""
              echo "### DIRECT APK DOWNLOADS"
              echo "- Debug APK: ${DIRECT_DOWNLOAD_URL}"
              echo "- Release APK: ${DIRECT_RELEASE_DOWNLOAD_URL}"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Warning: Publishing the APK to GitHub Releases failed."
            echo "The APK build succeeded and the normal GitHub Actions artifacts 'app-debug-apk' and 'app-release-apk' remain available for download."

            {
              echo "## GitHub Release Warning"
              echo ""
              echo "Publishing to GitHub Releases failed, but the APK builds succeeded and the GitHub Actions backup artifacts \`app-debug-apk\` and \`app-release-apk\` remain available."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
