name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version and tag
        id: version
        run: |
          set -e
          GRADLE_VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)
          PKG_VERSION=$(node -p "try { require('./package.json').version } catch(e) { '' }" 2>/dev/null || true)

          if [ -n "${GRADLE_VERSION}" ]; then
            BASE_VERSION="${GRADLE_VERSION}"
          elif [ -n "${PKG_VERSION}" ] && [ "${PKG_VERSION}" != "0.0.0" ]; then
            BASE_VERSION="${PKG_VERSION}"
          else
            BASE_VERSION="1.0.0"
          fi

          CANDIDATE_TAG="v${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          if git rev-parse "${CANDIDATE_TAG}" >/dev/null 2>&1; then
            TAG="${CANDIDATE_TAG}-${GITHUB_RUN_ATTEMPT}"
          else
            TAG="${CANDIDATE_TAG}"
          fi

          echo "base_version=${BASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "title=Release ${TAG} (Build #${GITHUB_RUN_NUMBER})" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${TAG}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies, build web bundle, and sync Capacitor Android
        run: |
          set -e
          npm install --legacy-peer-deps || npm install
          npm run build
          npx cap sync android
          find android node_modules/@capacitor -name "*.gradle" -type f -exec sed -i 's/VERSION_21/VERSION_17/g' {} +
          find android node_modules/@capacitor -name "*.gradle" -type f -exec sed -i 's/com\.android\.tools\.build:gradle:8\.13\.0/com.android.tools.build:gradle:9.1.1/g' {} +
          find android node_modules/@capacitor -name "*.gradle" -type f -exec sed -i 's/tasks\.withType(Javadoc)\.all/tasks.withType(Javadoc).configureEach/g' {} +
          if [ -f "android/capacitor.settings.gradle" ]; then
            sed -i "s/new File('\.\.\/node_modules\//new File(settingsDir, '..\/node_modules\//g" android/capacitor.settings.gradle
          fi

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -e
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version output: ${JAVA_VER_OUTPUT}"
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | sed -E 's/.*"([0-9]+)(\.[0-9]+)*".*/\1/')
          if ! echo "${JAVA_MAJOR}" | grep -Eq '^[0-9]+$'; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java version (${JAVA_MAJOR}) is lower than required Java 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -e
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "${KEYSTORE_FILE}" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_FILE}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_FILE}..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "${KEYSTORE_FILE}" ] || [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "Error: Failed to create temporary debug keystore at ${KEYSTORE_FILE}."
            exit 1
          fi
          mkdir -p "${HOME}/.android"
          cp "${KEYSTORE_FILE}" "${HOME}/.android/debug.keystore"
          cp "${KEYSTORE_FILE}" "android/debug.keystore"
          cp "${KEYSTORE_FILE}" "android/app/debug.keystore"
          echo "Confirmed temporary debug keystore exists at ${KEYSTORE_FILE}."

      - name: Build Debug APK
        run: |
          set -e
          (cd android && gradle :app:assembleDebug --stacktrace --no-daemon)
          mkdir -p app/build/outputs/apk/debug
          cp android/app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Verify generated Debug APK
        run: |
          set -e
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK was not found at ${EXPECTED_APK}."
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ] || [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is missing or empty."
            exit 1
          fi
          echo "Verified valid debug APK at ${EXPECTED_APK}."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -e
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          TARGET_APK="${RELEASE_TEMP_DIR}/app-debug.apk"
          cp "${SOURCE_APK}" "${TARGET_APK}"
          if [ ! -f "${TARGET_APK}" ] || [ ! -s "${TARGET_APK}" ]; then
            echo "Error: Failed to prepare release asset at ${TARGET_APK}."
            exit 1
          fi
          echo "asset_path=${TARGET_APK}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset at ${TARGET_APK}."

      - name: Tag repository and publish GitHub Release with APK
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.title }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f -a "${TAG}" "${GITHUB_SHA}" -m "${TITLE}"
          git push origin "refs/tags/${TAG}" --force

          NOTES="Automated Android APK release for **${TAG}**.

          - **Version:** \`${TAG}\`
          - **Build Run:** #${GITHUB_RUN_NUMBER} (Attempt ${GITHUB_RUN_ATTEMPT})
          - **Commit SHA:** \`${GITHUB_SHA}\`
          - **Direct APK Download:** \`app-debug.apk\`"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET_PATH}" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest
          else
            gh release create "${TAG}" "${ASSET_PATH}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.title }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            gh release view "${TAG}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "Release Tag: ${TAG}"
            echo "Release Title: ${TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: ${DIRECT_DOWNLOAD_URL}"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "- **Direct APK Download URL:** ${DIRECT_DOWNLOAD_URL}"
              echo "- **Release Tag:** \`${TAG}\`"
              echo "- **Release Title:** ${TITLE}"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo ""
              echo "The normal GitHub Actions artifact \`app-debug-apk\` also remains available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "WARNING: Publishing the APK to GitHub Releases did not succeed."
            {
              echo "## APK BUILD STATUS"
              echo ""
              echo "Warning: Publishing the APK to GitHub Releases failed."
              echo "The debug APK build succeeded, and the normal GitHub Actions artifact named \`app-debug-apk\` remains available as a backup in this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
