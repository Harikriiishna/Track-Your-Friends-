name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "([^."]+).*/\1/')
          if [ "$JAVA_MAJOR" = "1" ]; then
            JAVA_MAJOR=$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "1\.([^."]+).*/\1/')
          fi
          echo "Detected active Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || ! echo "$JAVA_MAJOR" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: Active Java version could not be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Confirmed active Java version ($JAVA_MAJOR) is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore
          echo "Confirmed ./debug.keystore exists."

      - name: Prepare root Gradle workspace for Capacitor Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs android/app/libs
          npx cap sync android || true

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_SDK" > local.properties
          echo "sdk.dir=$ANDROID_SDK" > android/local.properties

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          EOF
          cp gradle.properties android/gradle.properties

          if [ -d "android/app" ]; then
            rm -rf app
            cp -r android/app app
            cp -r android/capacitor-cordova-android-plugins capacitor-cordova-android-plugins || true
            mkdir -p capacitor-cordova-android-plugins/src/main/libs app/libs
            cp android/variables.gradle variables.gradle
            cp android/build.gradle build.gradle
          fi

          find app android node_modules/@capacitor -name "*.gradle" -type f -exec sed -i 's/VERSION_21/VERSION_17/g' {} + 2>/dev/null || true

          cat << 'EOF' > settings.gradle
          include ':app'
          if (new File('./capacitor-cordova-android-plugins').exists()) {
            include ':capacitor-cordova-android-plugins'
            project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')
          } else if (new File('./android/capacitor-cordova-android-plugins').exists()) {
            include ':capacitor-cordova-android-plugins'
            project(':capacitor-cordova-android-plugins').projectDir = new File('./android/capacitor-cordova-android-plugins')
          }
          if (new File('./node_modules/@capacitor/android/capacitor').exists()) {
            include ':capacitor-android'
            project(':capacitor-android').projectDir = new File('./node_modules/@capacitor/android/capacitor')
          }
          if (new File('./node_modules/@capacitor/app/android').exists()) {
            include ':capacitor-app'
            project(':capacitor-app').projectDir = new File('./node_modules/@capacitor/app/android')
          }
          if (new File('./node_modules/@capacitor/status-bar/android').exists()) {
            include ':capacitor-status-bar'
            project(':capacitor-status-bar').projectDir = new File('./node_modules/@capacitor/status-bar/android')
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: $APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path mismatch."
            exit 1
          fi
          echo "Verified APK at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          RELEASE_TEMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")
          RELEASE_ASSET_PATH="${RELEASE_TEMP_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          echo "release_asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prepare_release_asset.outputs.release_asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK release asset does not exist."
            exit 1
          fi
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK release asset is empty."
            exit 1
          fi
          case "$RELEASE_ASSET" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared APK release asset does not end in .apk."
              exit 1
              ;;
          esac
          if [ "$(basename "$RELEASE_ASSET")" != "app-debug.apk" ]; then
            echo "ERROR: Prepared release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK.
          - Built by: GitHub Actions
          - Workflow run number: ${GITHUB_RUN_NUMBER}
          - Workflow run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Purpose: Intended for testing only (not a Play Store production release)
          - Signing: Signed only with a temporary debug keystore"

          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_PAGE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_PAGE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_APK_URL"
            echo "Backup Artifact: Actions artifact app-debug-apk remains available as a backup."

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_APK_URL"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page:** $RELEASE_PAGE_URL"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** The GitHub Actions artifact \`app-debug-apk\` remains available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the Actions artifact named app-debug-apk remains available."
            fi
            {
              echo "### WARNING: GitHub Release Publishing Failed"
              echo ""
              echo "The APK build succeeded, and the GitHub Actions artifact named \`app-debug-apk\` remains available for download."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
