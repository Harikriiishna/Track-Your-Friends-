name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([^."]+).*/\1/')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Java version cannot be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java 17+ verified successfully."

      - name: Verify Android Gradle Plugin version
        run: |
          if [ ! -f "gradle/libs.versions.toml" ]; then
            mkdir -p gradle
            echo '[versions]' > gradle/libs.versions.toml
            echo 'agp = "9.1.1"' >> gradle/libs.versions.toml
          fi
          if ! grep -q 'agp = "9.1.1"' gradle/libs.versions.toml && ! grep -q "agp = '9.1.1'" gradle/libs.versions.toml; then
            echo "ERROR: gradle/libs.versions.toml does not contain agp = \"9.1.1\""
            cat gradle/libs.versions.toml
            exit 1
          fi
          echo "Verified AGP 9.1.1 in gradle/libs.versions.toml"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore

      - name: Install web and native plugin dependencies
        run: |
          echo "Installing npm dependencies for Capacitor native plugins..."
          npm ci || npm install --legacy-peer-deps
          npm run build
          npx cap sync android || true

      - name: Prepare root workspace structure
        run: |
          echo "Configuring root workspace for Gradle execution..."
          
          # 1. Setup Android SDK path
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$ANDROID_SDK" > local.properties
          echo "sdk.dir=$ANDROID_SDK" > android/local.properties

          # 2. Setup gradle.properties with memory allocation and SDK suppression
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          EOF
          cp gradle.properties android/gradle.properties

          # 3. Mirror android project modules into root
          if [ -d "android/app" ]; then
            rm -rf app
            cp -r android/app app
            cp -r android/capacitor-cordova-android-plugins capacitor-cordova-android-plugins || true
            cp android/variables.gradle variables.gradle
          fi

          # 4. Copy debug keystore into modules
          cp ./debug.keystore app/debug.keystore || true
          cp ./debug.keystore android/app/debug.keystore || true

          # 5. Generate root settings.gradle resolving all Capacitor plugin projects
          cat << 'EOF' > settings.gradle
          include ':app'

          if (new File('./capacitor-cordova-android-plugins').exists()) {
            include ':capacitor-cordova-android-plugins'
            project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')
          } else if (new File('./android/capacitor-cordova-android-plugins').exists()) {
            include ':capacitor-cordova-android-plugins'
            project(':capacitor-cordova-android-plugins').projectDir = new File('./android/capacitor-cordova-android-plugins')
          }

          if (new File('./node_modules/@capacitor/android/capacitor').exists()) {
            include ':capacitor-android'
            project(':capacitor-android').projectDir = new File('./node_modules/@capacitor/android/capacitor')
          }

          if (new File('./node_modules/@capacitor/app/android').exists()) {
            include ':capacitor-app'
            project(':capacitor-app').projectDir = new File('./node_modules/@capacitor/app/android')
          }

          if (new File('./node_modules/@capacitor/status-bar/android').exists()) {
            include ':capacitor-status-bar'
            project(':capacitor-status-bar').projectDir = new File('./node_modules/@capacitor/status-bar/android')
          }
          EOF

          # 6. Copy root build.gradle
          cp android/build.gradle build.gradle

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ] && [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            mkdir -p app/build/outputs/apk/debug
            cp android/app/build/outputs/apk/debug/app-debug.apk "$TARGET_APK"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Target APK $TARGET_APK is missing."
            echo "Searching inside build outputs:"
            find . -maxdepth 5 -name "*.apk" || true
            exit 1
          fi
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is empty (0 bytes)."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $TARGET_APK does not have the .apk extension."
              exit 1
              ;;
          esac
          echo "Confirmed: $TARGET_APK exists, is a non-empty regular file with .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "$TEMP_DIR"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TEMP_DIR}/app-debug.apk"
          echo "asset_path=${TEMP_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: ${TEMP_DIR}/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Prepared APK asset invalid or missing."
            exit 1
          fi
          if [ "$(basename "$ASSET_FILE")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset must be named app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Beacon Debug APK #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - This is an automatically generated debug APK.
          - Built by GitHub Actions workflow run: #${{ github.run_number }}
          - Source Commit: ${{ github.sha }}
          - Signed with debug keystore for testing and evaluation.
          EOF
          )

          echo "Creating or updating GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest || gh release upload "$RELEASE_TAG" "$ASSET_FILE" --clobber

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo "=== BUILD RESULT SUMMARY ==="
          echo "Repository: ${{ github.repository }}"
          echo "Direct APK URL: $DIRECT_URL"
          
          echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct download link for the latest debug APK:" >> "$GITHUB_STEP_SUMMARY"
          echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Actions artifact 'app-debug-apk' is also available as backup." >> "$GITHUB_STEP_SUMMARY"
