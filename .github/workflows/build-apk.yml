name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: ${JAVA_VERSION_OUTPUT}"
          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | sed -E 's/.*"([0-9]+)(\.[0-9]+)*".*/\1/')
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect active Java major version." >&2
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java major version (${JAVA_MAJOR}) is lower than required 17." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "Generating temporary debug keystore at ${KEYSTORE_PATH}..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Existing debug keystore found at ${KEYSTORE_PATH}."
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "Error: Temporary debug keystore ./debug.keystore is missing or empty." >&2
            exit 1
          fi
          echo "Verified temporary debug keystore exists and is non-empty."

      - name: Build debug APK
        id: build_apk
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify built debug APK
        id: verify_apk
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK not found at ${EXPECTED_APK}." >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK paths:" >&2
              find "app/build/outputs/apk" -type f -name "*.apk" -print >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is not a regular file." >&2
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is empty (0 bytes)." >&2
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "Error: ${EXPECTED_APK} does not have an .apk extension." >&2
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path mismatch: ${EXPECTED_APK}" >&2
            exit 1
          fi

          echo "Verified valid debug APK at ${EXPECTED_APK} ($(wc -c < "${EXPECTED_APK}") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_TEMP_DIR="${RUNNER_TEMP}/apk-release-asset"
          rm -rf "${RELEASE_TEMP_DIR}"
          mkdir -p "${RELEASE_TEMP_DIR}"

          DEST_APK="${RELEASE_TEMP_DIR}/app-debug.apk"
          cp "${SOURCE_APK}" "${DEST_APK}"

          if [ ! -f "${DEST_APK}" ] || [ ! -s "${DEST_APK}" ]; then
            echo "Error: Prepared release asset at ${DEST_APK} is missing or empty." >&2
            exit 1
          fi

          ASSET_BASENAME=$(basename "${DEST_APK}")
          if [ "${ASSET_BASENAME}" != "app-debug.apk" ]; then
            echo "Error: Prepared release asset basename must be app-debug.apk, got ${ASSET_BASENAME}." >&2
            exit 1
          fi

          echo "asset_path=${DEST_APK}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=app-debug.apk" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ]; then
            echo "Error: Prepared APK file does not exist at ${ASSET_PATH}." >&2
            exit 1
          fi

          if [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared APK file is empty at ${ASSET_PATH}." >&2
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "Error: Prepared file ${ASSET_PATH} does not end in .apk." >&2
              exit 1
              ;;
          esac

          if [ "$(basename "${ASSET_PATH}")" != "app-debug.apk" ] || [ "${ASSET_NAME}" != "app-debug.apk" ]; then
            echo "Error: Prepared release asset must be named app-debug.apk." >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          RELEASE_NOTES=$(cat <<EOF
          Automatically generated Android debug APK release.

          - **Built by**: GitHub Actions
          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA**: ${GITHUB_SHA}
          - **Intended Use**: Testing only (not a Play Store production release)
          - **Signing**: Signed only with a temporary debug keystore
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}#app-debug.apk" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          BUILD_OUTCOME="${{ steps.build_apk.outcome }}"
          VERIFY_OUTCOME="${{ steps.verify_apk.outcome }}"
          RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"

          if [ "${PUBLISH_OUTCOME}" = "success" ] && [ -n "${RELEASE_TAG}" ]; then
            echo "Confirming published GitHub Release ${RELEASE_TAG}..."
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')
            DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "=========================================="
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: ${DIRECT_DOWNLOAD_URL}"
            echo "=========================================="

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "**Direct Latest Release APK Download URL:**"
              echo "${DIRECT_DOWNLOAD_URL}"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo ""
              echo "> Note: The normal GitHub Actions artifact \`app-debug-apk\` also remains available as a backup in this workflow run summary."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publication did not succeed. Do NOT use the direct latest-release link for this run."
            if [ "${BUILD_OUTCOME}" = "success" ] && [ "${VERIFY_OUTCOME}" = "success" ]; then
              echo "The debug APK build itself succeeded, and the normal GitHub Actions artifact 'app-debug-apk' remains available for download from the workflow summary page."
            else
              echo "The debug APK build did not complete successfully."
            fi

            {
              echo "## APK Release Publication Warning"
              echo ""
              echo "GitHub Release publication did not succeed for this run."
              if [ "${BUILD_OUTCOME}" = "success" ] && [ "${VERIFY_OUTCOME}" = "success" ]; then
                echo ""
                echo "- The debug APK build succeeded."
                echo "- The normal GitHub Actions artifact \`app-debug-apk\` remains available for download from this workflow run."
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
