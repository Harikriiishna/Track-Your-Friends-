name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and sync web assets to Android
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs android/app/libs
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and ensure SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_STRING"

          MAJOR_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VER"

          if [ -z "$MAJOR_VER" ]; then
            echo "::error::Failed to detect Java version."
            exit 1
          fi

          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Detected Java version ($MAJOR_VER) is lower than 17."
            exit 1
          fi

          echo "Java version verified: $MAJOR_VER >= 17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create debug.keystore."
            exit 1
          fi
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore
          echo "debug.keystore confirmed."

      - name: Build Debug APK
        run: |
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs android/app/libs
          chmod +x android/gradlew || true
          gradle -p android :app:assembleDebug -x lint -x lintDebug --stacktrace --no-daemon
          mkdir -p app/build/outputs/apk/debug
          cp android/app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$TARGET_APK" ] && [ -s "$TARGET_APK" ]; then
            echo "Confirmed $TARGET_APK exists and is not empty."
            ls -lh "$TARGET_APK"
          else
            echo "::error::$TARGET_APK does not exist or is empty!"
            echo "Searching android/app/build/outputs/apk for any discovered APKs..."
            find android/app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/app-debug.apk"
          echo "release_asset=$TEMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TEMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Beacon APK v1.0.${{ github.run_number }}"
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.release_asset }}"

          echo "Publishing GitHub Release $TAG_NAME with asset $RELEASE_ASSET..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$RELEASE_ASSET" --clobber
          else
            gh release create "$TAG_NAME" "$RELEASE_ASSET" \
              --title "$RELEASE_TITLE" \
              --target "${{ github.sha }}" \
              --latest \
              --notes "Automated Android APK release built from commit ${{ github.sha }}." || \
            gh release upload "$TAG_NAME" "$RELEASE_ASSET" --clobber
          fi

      - name: Report APK download result
        if: always()
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download latest debug APK here:" >> "$GITHUB_STEP_SUMMARY"
          echo "[$DOWNLOAD_URL]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "===================================================="
          echo "DIRECT APK DOWNLOAD URL:"
          echo "$DOWNLOAD_URL"
          echo "===================================================="

