name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 || true)
          if [ -z "${JAVA_VERSION_OUTPUT}" ]; then
            echo "Error: Java version output could not be detected."
            exit 1
          fi
          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | head -n 1 | sed -E 's/.*version "([0-9]+)(\.([0-9]+))?.*/\1/')
          if [ "${JAVA_MAJOR}" = "1" ]; then
            JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | head -n 1 | sed -E 's/.*version "1\.([0-9]+).*/\1/')
          fi
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "Error: Active Java major version could not be detected from: ${JAVA_VERSION_OUTPUT}"
            exit 1
          fi
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build the debug APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "Error: Expected APK not found at ${EXPECTED_APK}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is not a regular file."
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is empty."
            exit 1
          fi
          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "Error: ${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK is not at exact path app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Verified APK at ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          RELEASE_ASSET_PATH="${RELEASE_ASSET_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_ASSET_PATH}"
          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "Error: Failed to prepare release asset at ${RELEASE_ASSET_PATH}"
            exit 1
          fi
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          PREPARED_APK="${{ steps.prepare_release_asset.outputs.asset_path }}"
          if [ -z "${PREPARED_APK}" ] || [ ! -f "${PREPARED_APK}" ]; then
            echo "Error: Prepared APK does not exist at ${PREPARED_APK}"
            exit 1
          fi
          if [ ! -s "${PREPARED_APK}" ]; then
            echo "Error: Prepared APK is empty at ${PREPARED_APK}"
            exit 1
          fi
          case "${PREPARED_APK}" in
            *.apk) ;;
            *)
              echo "Error: Prepared APK does not end in .apk: ${PREPARED_APK}"
              exit 1
              ;;
          esac
          ASSET_FILENAME=$(basename "${PREPARED_APK}")
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "Error: Release asset filename is '${ASSET_FILENAME}', expected 'app-debug.apk'"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK build from GitHub Actions.

          - Built automatically by GitHub Actions
          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Debug APK intended for testing only
          - Not a production Play Store release
          - Signed with a temporary debug keystore"

          gh release create "${RELEASE_TAG}" "${PREPARED_APK}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          DIRECT_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ] && gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: ${DIRECT_DOWNLOAD_URL}"
            echo "Note: The normal Actions artifact app-debug-apk remains available as a backup."

            {
              echo "## GitHub Release Published"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page URL:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo "- **Backup Artifact:** \`app-debug-apk\` remains available in GitHub Actions artifacts."
              echo ""
              echo "### DIRECT APK DOWNLOAD"
              echo "${DIRECT_DOWNLOAD_URL}"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Warning: Publishing the APK to GitHub Releases failed."
            echo "The debug APK build succeeded and the normal GitHub Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "## GitHub Release Warning"
              echo ""
              echo "Publishing to GitHub Releases failed, but the debug APK build succeeded and the GitHub Actions backup artifact \`app-debug-apk\` remains available."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
