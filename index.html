    <script>
      // Gracefully suppress Vite HMR / Module runner WebSocket disconnection notices as per environment constraints
      (function() {
        var _origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0];
          if (
            typeof first === 'string' &&
            (first.indexOf('[vite]') !== -1 ||
              first.indexOf('WebSocket closed without opened') !== -1 ||
              first.indexOf('createWebSocketModuleRunnerTransport') !== -1)
          ) {
            return;
          }
          if (first instanceof Error && (first.message.indexOf('WebSocket') !== -1 || first.stack?.indexOf('@vite/client') !== -1)) {
            return;
          }
          _origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (event.message.includes('WebSocket') ||
              event.message.includes('vite') ||
              event.filename?.includes('@vite/client'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (
            reason &&
            ((reason.message &&
              (reason.message.includes('WebSocket') ||
                reason.message.includes('vite') ||
                reason.message.includes('closed without opened'))) ||
              (reason.stack && reason.stack.includes('@vite/client')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
